services:
  - type: web
    name: calorie-tracker-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker
    plan: free
    branch: main
    rootDir: server
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
