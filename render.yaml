services:
  - type: web
    name: calorie-tracker-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker
    plan: free
    branch: main
    rootDir: server
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: DATABASE_URL
        fromDatabase:
          name: calorie-tracker-db
          property: connectionString

databases:
  - name: calorie-tracker-db
    plan: free
    databaseName: calorie_tracker
    user: calorie_user
